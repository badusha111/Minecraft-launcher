name: Build NEXCRAFT for Windows

on:
  push:
    branches: [main]
    paths:
      - "src/NexcraftLauncher/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/NexcraftLauncher/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/NexcraftLauncher/NexcraftLauncher.csproj
      - name: Build
        run: dotnet build src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --no-restore
      - name: Publish self-contained application
        run: dotnet publish src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NEXCRAFT-win-x64
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT-Windows-x64-Portable
          path: artifacts/NEXCRAFT-win-x64/
          if-no-files-found: error
