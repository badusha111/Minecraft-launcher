name: Build NEXCRAFT Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/NexcraftLauncher/NexcraftLauncher.csproj

      - name: Build
        run: dotnet build src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --no-restore
