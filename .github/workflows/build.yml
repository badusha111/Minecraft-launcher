name: Build NEXCRAFT Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate application icon
        shell: pwsh
        run: |
          $iconBase64 = (Get-Content "assets/Nexcraft.ico.base64" -Raw).Trim()
          [System.IO.File]::WriteAllBytes("src/NexcraftLauncher/Nexcraft.ico", [Convert]::FromBase64String($iconBase64))

      - name: Restore
        run: dotnet restore src/NexcraftLauncher/NexcraftLauncher.csproj

      - name: Build
        run: dotnet build src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --no-restore

      - name: Publish Windows x64 app
        run: dotnet publish src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NEXCRAFT

      - name: Add installer files
        shell: pwsh
        run: |
          Copy-Item "packaging/Install-NEXCRAFT.bat" "artifacts/NEXCRAFT/Install-NEXCRAFT.bat"
          Copy-Item "packaging/Install-NEXCRAFT.ps1" "artifacts/NEXCRAFT/Install-NEXCRAFT.ps1"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/installer -Force | Out-Null
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" packaging/NEXCRAFT-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload launcher and installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT-Windows-x64
          path: |
            artifacts/NEXCRAFT/
            artifacts/installer/NEXCRAFT-Setup.exe
          if-no-files-found: error
