name: Build NEXCRAFT Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/NexcraftLauncher/NexcraftLauncher.csproj

      - name: Build
        run: dotnet build src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --no-restore

      - name: Publish Windows x64 app
        run: dotnet publish src/NexcraftLauncher/NexcraftLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NEXCRAFT

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT-Windows-x64
          path: artifacts/NEXCRAFT/
          if-no-files-found: error
