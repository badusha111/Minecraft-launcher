name: Build NEXCRAFT for macOS

on:
  push:
    branches: [main, feature/macos-port]
    paths:
      - "src/NexcraftLauncher.Mac/**"
      - "tools/generate_icon.py"
      - ".github/workflows/build-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/NexcraftLauncher.Mac/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Package macOS (${{ matrix.rid }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate NEXCRAFT icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_icon.py
      - name: Restore
        run: dotnet restore src/NexcraftLauncher.Mac/NexcraftLauncher.Mac.csproj
      - name: Publish
        run: dotnet publish src/NexcraftLauncher.Mac/NexcraftLauncher.Mac.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -o artifacts/publish
      - name: Create macOS app bundle
        shell: bash
        run: |
          APP="artifacts/NEXCRAFT-${{ matrix.rid }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$RUNNER_TEMP/NEXCRAFT.iconset"
          cp -R artifacts/publish/. "$APP/Contents/MacOS/"
          ICON="artifacts/icon/Nexcraft.png"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$ICON" --out "$RUNNER_TEMP/NEXCRAFT.iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" "$ICON" --out "$RUNNER_TEMP/NEXCRAFT.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$RUNNER_TEMP/NEXCRAFT.iconset" -o "$APP/Contents/Resources/NEXCRAFT.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>NEXCRAFT</string>
            <key>CFBundleDisplayName</key><string>NEXCRAFT</string>
            <key>CFBundleIdentifier</key><string>com.nexcraft.launcher</string>
            <key>CFBundleExecutable</key><string>NEXCRAFT</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>NEXCRAFT.icns</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/NEXCRAFT"
      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="artifacts/NEXCRAFT-${{ matrix.rid }}.app"
          PLIST="$APP/Contents/Info.plist"
          EXECUTABLE="$APP/Contents/MacOS/NEXCRAFT"

          test -d "$APP"
          test -f "$PLIST"
          test -x "$EXECUTABLE"
          plutil -lint "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -Fx 'com.nexcraft.launcher'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" | grep -Fx 'NEXCRAFT'

          ARCHS="$(lipo -archs "$EXECUTABLE")"
          case "${{ matrix.rid }}" in
            osx-arm64) echo "$ARCHS" | grep -qw arm64 ;;
            osx-x64) echo "$ARCHS" | grep -qw x86_64 ;;
          esac
          echo "Verified $APP; executable architectures: $ARCHS"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT-${{ matrix.rid }}.app
          path: artifacts/NEXCRAFT-${{ matrix.rid }}.app/
          if-no-files-found: error
